services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_career
    command: "php artisan serve --host 0.0.0.0 --port 8000"
    image: rizan1998/madtive_career
    ports:
      - "9778:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: secret
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - ./docker/images:/var/www/public/images/upload

    depends_on:
      - db
    networks:
      - himed_network

  db:
    image: mysql:5.7.35
    container_name: db_career
    ports:
      - "33015:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: laravel
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=256M
      --bind-address=0.0.0.0
      --skip-name-resolve
    volumes:
      - mysql_data_5_7:/var/lib/mysql
    networks:
      - himed_network

networks:
  himed_network:
    external: true

volumes:
  mysql_data_5_7:
    driver: local